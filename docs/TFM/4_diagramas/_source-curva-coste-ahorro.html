<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fcfcfb;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
text{fill:#0b0b0b} .sec{fill:#52514e} .ax{stroke:#c9c8c2;stroke-width:1}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
  <rect width="900" height="540" fill="#fcfcfb"/>
  <!-- leyenda -->
  <g font-size="14">
    <line x1="96" y1="34" x2="124" y2="34" stroke="#eb6834" stroke-width="2"/><circle cx="110" cy="34" r="4" fill="#eb6834"/>
    <text x="132" y="39">Sin arnés</text>
    <line x1="226" y1="34" x2="254" y2="34" stroke="#2a78d6" stroke-width="2"/><circle cx="240" cy="34" r="4" fill="#2a78d6"/>
    <text x="262" y="39">Con arnés</text>
  </g>
  <!-- área de ahorro -->
  <polygon points="530,232.6 840,90 840,200" fill="#2a78d6" opacity="0.10"/>
  <!-- ejes -->
  <line class="ax" x1="80" y1="440" x2="850" y2="440"/>
  <line class="ax" x1="80" y1="440" x2="80" y2="70"/>
  <!-- inversión inicial -->
  <line x1="68" y1="440" x2="68" y2="280" stroke="#52514e" stroke-width="1"/>
  <line x1="63" y1="440" x2="73" y2="440" stroke="#52514e" stroke-width="1"/>
  <line x1="63" y1="280" x2="73" y2="280" stroke="#52514e" stroke-width="1"/>
  <text class="sec" x="96" y="330" font-size="13">Inversión inicial:</text>
  <text class="sec" x="96" y="348" font-size="13">meses de construir,</text>
  <text class="sec" x="96" y="366" font-size="13">probar y rehacer</text>
  <!-- series -->
  <line x1="80" y1="440" x2="840" y2="90" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="280" x2="840" y2="200" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
  <!-- punto de equilibrio -->
  <line x1="530" y1="232.6" x2="530" y2="440" stroke="#c9c8c2" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="530" cy="232.6" r="6" fill="#fcfcfb"/><circle cx="530" cy="232.6" r="4" fill="#0b0b0b"/>
  <text x="530" y="462" font-size="13" text-anchor="middle">Punto de equilibrio</text>
  <!-- etiquetas directas -->
  <text x="832" y="72" font-size="14" text-anchor="end" font-weight="600">Sin arnés</text>
  <text class="sec" x="700" y="118" font-size="13" text-anchor="end">cada documento se paga entero,</text>
  <text class="sec" x="700" y="136" font-size="13" text-anchor="end">al escribirlo y al leerlo</text>
  <text x="832" y="228" font-size="14" text-anchor="end" font-weight="600">Con arnés</text>
  <text class="sec" x="832" y="246" font-size="13" text-anchor="end">cada uso cuesta poco</text>
  <text class="sec" x="748" y="170" font-size="13" text-anchor="middle">Ahorro acumulado</text>
  <!-- títulos de eje -->
  <text class="sec" x="465" y="500" font-size="13" text-anchor="middle">Documentaciones generadas y leídas por el equipo  →</text>
  <text class="sec" x="34" y="255" font-size="13" text-anchor="middle" transform="rotate(-90 34 255)">Coste acumulado (tiempo del equipo)  →</text>
  <text class="sec" x="840" y="526" font-size="12" text-anchor="end">Esquema conceptual, sin escala. No representa datos medidos.</text>
</svg></body></html>
